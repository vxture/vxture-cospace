[project]
name = "vxture-cospace"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.14.2",
  "uvicorn==0.54.0",
  "jsonschema==4.26.0",
  "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "alembic==1.20.1",
  "joserfc==1.7.7",
  "cryptography==50.0.2",
]

[project.optional-dependencies]
input = [
    "rosbags==0.11.9",
]
preview = [
    "numpy==2.5.4",
    "scipy==1.18.1",
]

[dependency-groups]
dev = ["httpx2==2.16.0", "pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
