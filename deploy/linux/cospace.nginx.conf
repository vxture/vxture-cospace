# HISTORICAL worker01 configuration, retained for incident traceability only.
# Do not install this file. Future ingress must be registered by the platform
# for the worker02 product upstream. See docs/50-deployment/10-worker02-correction.md.
# Product-owned addition to conf.d/90-cospace-product.conf.
# Platform sync regenerates sites-enabled; it preserves product-owned conf.d files.
# Existing SAN certificate covers *.ruyin.work. No account endpoints move domains.
server {
    listen 80;
    listen [::]:80;
    server_name cospace.ruyin.work;
    return 308 https://cospace.ruyin.work$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name cospace.ruyin.work;
    ssl_certificate /etc/nginx/ssl/live/vxture.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/vxture.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    # Never retain authorization codes, state or query tokens in access logs.
    access_log off;
    error_log /var/log/nginx/cospace-error.log crit;
    client_max_body_size 128m;
    location = /api/webhooks/vxture {
        client_max_body_size 64k;
        proxy_pass http://100.100.197.42:8793;
        proxy_set_header Host cospace.ruyin.work;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 15s;
    }
    location / {
        proxy_pass http://100.100.197.42:8793;
        proxy_http_version 1.1;
        proxy_set_header Host cospace.ruyin.work;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
