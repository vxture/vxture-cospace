[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vxture-ontology"
version = "0.1.0.dev2"
description = "Portable ontology definition validation and dependency resolution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
vxture-ontology = "vxture_ontology.__main__:main"
vxture-ontology-host = "vxture_ontology.local_host.__main__:main"

[tool.setuptools]
packages = ["vxture_ontology", "vxture_ontology.local_host"]
package-dir = {vxture_ontology = "."}

[tool.setuptools.package-data]
vxture_ontology = ["definitions.json", "instance.schema.json", "park-baseline.rules.json"]
