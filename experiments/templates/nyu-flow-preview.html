<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CoSpace · 真实资料流程预览</title>
<style>*{box-sizing:border-box}body{margin:0;background:#0b1019;color:#dfe7f1;font:13px system-ui}header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #263142}header strong{font-size:18px;font-weight:600}small{color:#8c9bb0}main{display:grid;grid-template-columns:1fr 280px;height:calc(100vh - 52px)}#stage{position:relative;min-width:0}canvas{width:100%;height:100%;display:block;touch-action:none}.toolbar{position:absolute;left:20px;top:18px;display:flex;gap:8px}button,a,input{font:inherit}button{height:32px;border:1px solid #384760;border-radius:6px;background:#172235;color:#e1e9f4;padding:0 12px;cursor:pointer}button.active{background:#245fe5;border-color:#245fe5}aside{padding:20px;border-left:1px solid #263142;overflow:auto}h2{font-size:14px;font-weight:600;margin:0 0 14px}p{color:#97a7bc;line-height:1.7;margin:10px 0}.steps{line-height:2.4;color:#b7c8dc;border-bottom:1px solid #263142;padding-bottom:16px;margin-bottom:18px}.steps span{color:#5bceab;margin-right:8px}input{width:100%;height:32px;background:#0e1725;color:#dfe7f1;border:1px solid #384760;border-radius:5px;padding:0 8px;margin:4px 0}.primary{background:#245fe5;border-color:#245fe5;width:100%;margin-top:8px}pre{font:11px ui-monospace;white-space:pre-wrap;color:#9cb3cc;line-height:1.6}a{color:#8eb1ff;line-height:2}#hint{position:absolute;bottom:18px;left:20px;color:#8c9bb0}.badge{padding:4px 8px;background:#30291b;color:#d9bd83;border-radius:5px}@media(max-width:750px){main{grid-template-columns:1fr}aside{height:260px}#stage{height:55vh}}</style>
<header><strong>CoSpace <small>空间构建流程预览</small></strong><span class="badge">模型候选 · 精度未验收</span></header>
<main><section id="stage"><canvas id="view"></canvas><div class="toolbar"><button id="human" class="active">彩色人视图</button><button id="agent">智能体表面视图</button><button id="reset">复位</button></div><div id="hint">拖动旋转 · 滚轮缩放 · 两类视图由同一空间模型派生</div></section><aside><h2>流程</h2><div class="steps"><div><span>✓</span>资料导入与封存</div><div><span>✓</span>空间模型候选构建</div><div><span>✓</span>人视图派生</div><div><span>✓</span>智能体视图派生</div><div id="service">○ 本机服务连接中</div></div><p id="summary"></p><h2>查询智能体视图</h2><p>填写局部坐标（米），或使用表面示例点。</p><input id="point" aria-label="查询坐标" value="0, 0, 0"><button id="example">填入表面示例</button><button id="query" class="primary">查询空间状态</button><pre id="result"></pre><p>只表达观测表面候选；没有证据的区域返回未知，不推断可通行。</p><a href="model.json" target="_blank">模型与来源清单 ↗</a><br><a href="human.ply">下载人视图 PLY</a><br><a href="agent.npz">下载智能体离线视图</a><br><a href="offline-checks.json" target="_blank">离线查询核对 ↗</a><section id="semantic-panel" hidden><h2>对象标注</h2><p>两类视图读取同一对象记录，类型与位置含义待现场核实。</p><select id="semantic-select" aria-label="选择标注对象" style="width:100%;height:32px;background:#172235;color:#dfe7f1;border:1px solid #384760;border-radius:5px"></select><pre id="semantic-detail"></pre></section></aside></main>
<script src="views.js"></script><script>
const data=window.PREVIEW_VIEWS, canvas=document.getElementById('view'),ctx=canvas.getContext('2d');
let yaw=-.18,pitch=.10,zoom=1,kind='human',drag=null;const points=data.points;
const min=[Infinity,Infinity,Infinity],max=[-Infinity,-Infinity,-Infinity];for(const p of points)for(let j=0;j<3;j++){min[j]=Math.min(min[j],p[j]);max[j]=Math.max(max[j],p[j]);}const center=min.map((v,j)=>(v+max[j])/2),extent=Math.max(...max.map((v,j)=>v-min[j]));
function render(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio,2);canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;ctx.scale(dpr,dpr);const w=rect.width,h=rect.height;ctx.fillStyle='#0b1019';ctx.fillRect(0,0,w,h);const source=kind==='human'?data.points:data.agent_points,ca=Math.cos(yaw),sa=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),scale=Math.min(w,h)*1.5/extent*zoom;let projected=[];for(let i=0;i<source.length;i++){const p=source[i],x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2],rx=ca*x+sa*z,rz=-sa*x+ca*z,ry=cp*y-sp*rz;projected.push([rx*scale+w/2,ry*scale+h/2,sp*y+cp*rz,i]);}projected.sort((a,b)=>b[2]-a[2]);for(const [x,y,z,i] of projected){if(x<0||y<0||x>w||y>h)continue;const c=data.colors[i];ctx.fillStyle=kind==='human'?`rgb(${c[0]},${c[1]},${c[2]})`:'#5ecbc0';const size=kind==='human'?2:2.5;ctx.fillRect(x,y,size,size);}}
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY];canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!drag)return;yaw+=(e.clientX-drag[0])*.005;pitch+=(e.clientY-drag[1])*.005;drag=[e.clientX,e.clientY];render()};canvas.onpointerup=()=>drag=null;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.2,Math.min(6,zoom*Math.exp(-e.deltaY*.001)));render()};
for(const k of ['human','agent'])document.getElementById(k).onclick=()=>{kind=k;document.getElementById('human').classList.toggle('active',k==='human');document.getElementById('agent').classList.toggle('active',k==='agent');render()};document.getElementById('reset').onclick=()=>{yaw=-.18;pitch=.10;zoom=1;render()};new ResizeObserver(render).observe(canvas);
document.getElementById('example').onclick=()=>document.getElementById('point').value=data.agent_points[0].join(', ');
const manifestReady=fetch('./api/preview').then(r=>{if(!r.ok)throw Error();return r.json()}).then(m=>{document.getElementById('service').textContent='✓ 本机服务已接通';document.getElementById('human').textContent=m.human_view.appearance==='neutral_not_rgb'?'点云人视图':m.human_view.appearance==='intensity_grayscale_not_rgb'?'强度人视图':'彩色人视图';document.getElementById('summary').textContent=`${m.label||'NYU办公室'} · ${m.data_kind==='existing_pointcloud_candidate'?'已有点云':m.construction.used_frames+'/'+m.construction.input_frames+'帧'} · ${m.construction.model_points.toLocaleString()}个模型点 · ${m.agent_view.surface_cells.toLocaleString()}个表面单元。${m.data_kind==='existing_pointcloud_candidate'?'保留声明坐标，对齐未核验；':m.data_kind==='real_lidar_sensor_local_candidate'?'传感器局部坐标，单帧未配准；灰度来自强度；':'其余帧暂未纳入；'}${m.semantic_annotation?m.semantic_annotation.object_count+"个对象标注待核实":"暂无语义对象"}。`;return m;}).catch(()=>document.getElementById('service').textContent='○ 静态查看，请用本机服务打开查询');
document.getElementById('query').onclick=async()=>{try{const p=document.getElementById('point').value.split(',').map(v=>Number(v.trim()));if(p.length!==3||!p.every(Number.isFinite))throw Error('请填写三个有限坐标');const r=await fetch('./api/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({point_m:p})});const d=await r.json();if(!r.ok)throw Error(JSON.stringify(d));document.getElementById('result').textContent=(d.state==='surface_candidate'?'观测表面候选':'未知区域')+'\n'+JSON.stringify(d,null,2)}catch(e){document.getElementById('result').textContent=e.message}};render();
</script><script>
let semanticObjects=[],selectedSemantic=null;const originalCenter=[...center],geometryRender=render;
render=function(){geometryRender();const rect=canvas.getBoundingClientRect(),w=rect.width,h=rect.height,scale=Math.min(w,h)*1.5/extent*zoom,ca=Math.cos(yaw),sa=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);for(const obj of semanticObjects){const p=obj.anchor_m,x=p[0]-center[0],y=p[1]-center[1],z=p[2]-center[2],rx=ca*x+sa*z,rz=-sa*x+ca*z,ry=cp*y-sp*rz,sx=rx*scale+w/2,sy=ry*scale+h/2;if(sx<0||sy<0||sx>w||sy>h)continue;ctx.strokeStyle='#f3bf60';ctx.fillStyle='#f3bf60';ctx.lineWidth=2;ctx.beginPath();ctx.arc(sx,sy,obj.object_id===selectedSemantic?7:4,0,2*Math.PI);ctx.stroke();if(obj.object_id===selectedSemantic){ctx.font='12px system-ui';ctx.fillText((obj.properties.name||obj.object_id)+' · 待核实',sx+12,sy-8);}}};
const semanticSelect=document.getElementById('semantic-select');
semanticSelect.onchange=()=>{const obj=semanticObjects.find(o=>o.object_id===semanticSelect.value);if(!obj)return;selectedSemantic=obj.object_id;for(let i=0;i<3;i++)center[i]=obj.anchor_m[i];document.getElementById('semantic-detail').textContent=JSON.stringify(obj,null,2);render();};
document.getElementById('reset').addEventListener('click',()=>{for(let i=0;i<3;i++)center[i]=originalCenter[i];render();});new ResizeObserver(()=>render()).observe(canvas);
manifestReady.then(m=>m?.semantic_annotation?fetch('./api/objects'):null).then(async r=>{if(!r||!r.ok)return null;return r.json();}).then(doc=>{if(!doc)return;semanticObjects=doc.objects;document.getElementById('semantic-panel').hidden=false;for(const obj of semanticObjects){const option=document.createElement('option');option.value=obj.object_id;option.textContent=(obj.properties.name||obj.object_id)+' · '+obj.object_id+' · 待核实';semanticSelect.appendChild(option);}semanticSelect.dispatchEvent(new Event('change'));}).catch(()=>{document.getElementById('semantic-panel').hidden=false;document.getElementById('semantic-detail').textContent='对象快照不可读，请核对固定版本。';});
</script></html>
