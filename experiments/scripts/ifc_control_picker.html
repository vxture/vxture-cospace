<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SG3 · 三维控制点复核</title>
<style>
  * { box-sizing: border-box }
  body { margin: 0 auto; max-width: 1472px; padding: 24px; color: #162d43; background: #f3f6fa; font: 15px system-ui }
  h1 { margin: 0 0 8px } h2 { font-size: 17px }
  .views { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px }
  section { background: white; border: 1px solid #d3dee9; border-radius: 12px; padding: 16px; margin-bottom: 16px }
  canvas { display: block; width: 100%; height: clamp(300px, 48vh, 550px); background: #eaf1f8; border-radius: 8px; touch-action: none }
  button, select, input { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #b2c3d5; color: inherit; background: #fff }
  button { cursor: pointer } input { width: min(100%, 35ch) } .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-block: 8px }
  output { display: block; min-height: 2em; margin-top: 8px; overflow-wrap: anywhere }
  .primary { background: #18568c; color: white }
  @media (max-width: 820px) { .views { grid-template-columns: 1fr } }
</style>
<h1>SG3 · 三维控制点复核</h1>
<p>两侧保持各自的坐标系。拖动旋转，Shift + 拖动平移，滚轮缩放。点选只记录可见样本附近的候选，请换角度核对。</p>
<div class="views">
  <section data-source="ifc">
    <h2>IFC · 结构网格</h2>
    <div class="tools"><button data-view="xy">俯视</button><button data-view="xz">侧视 XZ</button><button data-view="yz">侧视 YZ</button><button data-view="reset">复位</button></div>
    <canvas aria-label="IFC 原坐标结构线框"></canvas>
    <output aria-live="polite">点选一个网格顶点</output>
  </section>
  <section data-source="cloud">
    <h2>HL2 · 点云</h2>
    <div class="tools"><button data-view="xy">俯视</button><button data-view="xz">侧视 XZ</button><button data-view="yz">侧视 YZ</button><button data-view="reset">复位</button></div>
    <canvas aria-label="HL2 原坐标点样本"></canvas>
    <output aria-live="polite">点选一个采样点</output>
  </section>
</div>
<section>
  <h2>候选记录</h2>
  <p id="samples"></p>
  <div class="tools">
    <label>用途 <select id="purpose"><option value="fit">拟合</option><option value="check">独立检查</option></select></label>
    <label>特征说明 <input id="evidence" maxlength="240" placeholder="例如：长廊端墙与北侧墙交角"></label>
    <button id="add" class="primary">记录候选</button>
    <button id="export">导出工作表</button>
  </div>
  <output id="message" aria-live="polite"></output>
  <ol id="pairs"></ol>
</section>
<script id="picker-data" type="application/json">__PICKER_DATA__</script>
<script>
'use strict';
const data = JSON.parse(document.querySelector('#picker-data').textContent);
const sheet = data.worksheet;
const selected = {};
const redraw = {};
const $ = id => document.getElementById(id);
$('samples').textContent = `HL2 显示 ${data.cloud.vertices.length.toLocaleString()} / ${data.cloud.total.toLocaleString()} 个原始点样本。单位尚未核实；候选和工作表均不代表配准结果。`;
const views = {xy: [0, Math.PI / 2], xz: [0, 0], yz: [-Math.PI / 2, 0], reset: [-.45, .62]};

function mount(section) {
  const key = section.dataset.source;
  const model = data[key];
  const canvas = section.querySelector('canvas');
  const out = section.querySelector('output');
  const ctx = canvas.getContext('2d');
  const bounds = [[Infinity, Infinity, Infinity], [-Infinity, -Infinity, -Infinity]];
  for (const point of model.vertices) point.forEach((n, i) => {
    bounds[0][i] = Math.min(bounds[0][i], n);
    bounds[1][i] = Math.max(bounds[1][i], n);
  });
  const center = bounds[0].map((n, i) => (n + bounds[1][i]) / 2);
  const diameter = Math.hypot(...bounds[0].map((n, i) => bounds[1][i] - n)) || 1;
  let [yaw, pitch] = views.reset;
  let zoom = 1, px = 0, py = 0, projected = [], drag, frame;

  function paint() {
    const {width, height} = canvas.getBoundingClientRect();
    if (!width || !height) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const s = .93 * Math.min(width, height) / diameter * zoom;
    const a = Math.cos(yaw), b = Math.sin(yaw), c = Math.cos(pitch), d = Math.sin(pitch);
    projected = model.vertices.map(([x, y, z]) => {
      x -= center[0]; y -= center[1]; z -= center[2];
      const v = x * b + y * a;
      return [width / 2 + px + (x * a - y * b) * s,
        height / 2 + py - (z * c + v * d) * s, z * d - v * c];
    });
    if (model.faces) {
      ctx.strokeStyle = '#2466844d';
      ctx.beginPath();
      for (const [i, j, k] of model.faces) {
        ctx.moveTo(projected[i][0], projected[i][1]);
        ctx.lineTo(projected[j][0], projected[j][1]);
        ctx.lineTo(projected[k][0], projected[k][1]);
        ctx.closePath();
      }
      ctx.stroke();
    } else {
      ctx.fillStyle = '#18568c70';
      for (const [x, y] of projected) if (x >= 0 && x < width && y >= 0 && y < height)
        ctx.fillRect(x, y, 1.5, 1.5);
    }
    if (selected[key]) {
      const [x, y] = projected[selected[key].index];
      ctx.strokeStyle = '#ae4b12';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(x, y, 8, 0, 2 * Math.PI); ctx.stroke();
    }
  }
  function schedule() { cancelAnimationFrame(frame); frame = requestAnimationFrame(paint); }
  function pick(x, y) {
    let index = -1, score = Infinity, depth = -Infinity;
    projected.forEach(([sx, sy, z], i) => {
      const distance = Math.hypot(sx - x, sy - y);
      if (distance > 8) return;
      const bucket = Math.round(distance * 2);
      if (bucket < score || (bucket === score && z > depth)) {
        index = i; score = bucket; depth = z;
      }
    });
    if (index < 0) {
      out.textContent = '附近没有顶点或采样点，请放大后再选。';
      delete selected[key]; schedule(); return;
    }
    const element = model.elements?.findLast(row => row.start <= index);
    const reference = element ? {global_id: element.global_id, vertex: index - element.start} :
      {ply_point_index: index * model.stride};
    const xyz = model.vertices[index];
    selected[key] = {index, xyz, reference};
    out.textContent = xyz.map(v => v.toFixed(4)).join(', ') + (element ? ` · ${element.ifc_type}` : ` · 点序号 ${reference.ply_point_index}`);
    schedule();
  }
  canvas.addEventListener('pointerdown', event => {
    if (event.button !== 0) return;
    canvas.setPointerCapture(event.pointerId);
    drag = {id: event.pointerId, x: event.clientX, y: event.clientY, moved: false, pan: event.shiftKey};
  });
  canvas.addEventListener('pointermove', event => {
    if (drag?.id !== event.pointerId) return;
    const dx = event.clientX - drag.x, dy = event.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    drag.moved = true; drag.x = event.clientX; drag.y = event.clientY;
    if (drag.pan) { px += dx; py += dy; }
    else { yaw += dx / 140; pitch = Math.max(-Math.PI / 2, Math.min(Math.PI / 2, pitch - dy / 140)); }
    schedule();
  });
  canvas.addEventListener('pointerup', event => {
    if (drag?.id !== event.pointerId) return;
    if (!drag.moved && !drag.pan) {
      const box = canvas.getBoundingClientRect();
      pick(event.clientX - box.left, event.clientY - box.top);
    }
    drag = null;
  });
  canvas.addEventListener('pointercancel', () => { drag = null; });
  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    const next = Math.max(.5, Math.min(30, zoom * Math.exp(-event.deltaY * .0015)));
    const box = canvas.getBoundingClientRect();
    const x = event.clientX - box.left - box.width / 2, y = event.clientY - box.top - box.height / 2;
    px = x + (px - x) * next / zoom;
    py = y + (py - y) * next / zoom;
    zoom = next; schedule();
  }, {passive: false});
  for (const button of section.querySelectorAll('[data-view]')) button.onclick = () => {
    [yaw, pitch] = views[button.dataset.view]; zoom = 1; px = py = 0; schedule();
  };
  new ResizeObserver(schedule).observe(canvas);
  redraw[key] = () => {
    out.textContent = key === 'ifc' ? '点选一个网格顶点' : '点选一个采样点';
    schedule();
  };
}
document.querySelectorAll('section[data-source]').forEach(mount);

let nextId = 1;
function updatePairs() {
  $('pairs').replaceChildren();
  for (const pair of sheet.pairs) {
    const row = document.createElement('li'), remove = document.createElement('button');
    row.textContent = `${pair.id} · ${pair.purpose === 'fit' ? '拟合' : '独立检查'} · ${pair.description} `;
    remove.textContent = '移除';
    remove.onclick = () => { sheet.pairs = sheet.pairs.filter(p => p !== pair); updatePairs(); };
    row.append(remove);
    $('pairs').append(row);
  }
  const fit = sheet.pairs.filter(p => p.purpose === 'fit').length;
  $('message').textContent = `已记录 ${fit} 组拟合候选、${sheet.pairs.length - fit} 组检查候选。`;
}
$('add').onclick = () => {
  const description = $('evidence').value.trim();
  const {ifc, cloud} = selected;
  if (!ifc || !cloud || !description) {
    $('message').textContent = '请在两侧各选一个点，并填写同一物理特征的说明。'; return;
  }
  if (sheet.pairs.length >= 256) { $('message').textContent = '工作表最多记录 256 组。'; return; }
  if (sheet.pairs.some(p => ['ifc', 'cloud'].some(k => p[k].xyz.every((n, i) => n === selected[k].xyz[i])))) {
    $('message').textContent = '该点已在工作表中；拟合与检查不得共用点。'; return;
  }
  const withEvidence = p => ({xyz: p.xyz, reference: p.reference});
  sheet.pairs.push({id: `control-${nextId++}`, purpose: $('purpose').value, description,
    ifc: withEvidence(ifc), cloud: withEvidence(cloud), verified: false});
  $('evidence').value = '';
  delete selected.ifc; delete selected.cloud; redraw.ifc(); redraw.cloud(); updatePairs();
};
$('export').onclick = () => {
  const url = URL.createObjectURL(new Blob([JSON.stringify(sheet, null, 2)], {type: 'application/json'}));
  const link = document.createElement('a');
  link.href = url; link.download = 'control-worksheet.json'; link.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
};
updatePairs();
</script>
</html>
