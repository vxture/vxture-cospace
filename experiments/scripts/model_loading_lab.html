<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="icon" href="data:,"><title>L03 合成园区对照 · 非测绘成果</title>
<style>html,body{margin:0;height:100%;font:12px system-ui;background:#090d16;color:white}header{height:32px;display:flex;gap:12px;align-items:center;padding:0 12px}button{height:32px}iframe{position:absolute;top:32px;left:0;width:100%;height:calc(100% - 32px);border:0}output{position:absolute;bottom:8px;left:8px;max-width:90%;pointer-events:none;font:10px monospace;background:#111a}</style>
<header><span>L03 合成对照 · 非生产页面</span><button id="target">进入作业点</button><button id="path">快速切换作业区域</button><button id="overview">全图</button><button id="exact">核验原始点</button><span id="status">正在加载</span></header>
<iframe title="对照用成熟点云画布"></iframe><output id="diagnostics"></output>
<script>
const frame=document.querySelector('iframe'),channel='cospace.pointcloud/1',session=crypto.randomUUID();
let fixture;
// Load typed data alongside the native engine; source text never becomes HTML/JS.
const fixtureReady=fetch('/loading-lab/fixture'+location.search,{cache:'no-store'}).then(r=>{if(!r.ok){throw new Error('Fixture unavailable');}return r.json();});
document.querySelectorAll('button').forEach(button=>{button.disabled=true;});
let first=0,initialized=0,action=0,exactMs=0,exactValid=false,pathEnded=0,pathRunning=false,latest={},peakFrameP95=0,peakFrame=0;
const post=(type,values={})=>frame.contentWindow.postMessage({channel,session,type,...values},location.origin);
const focus=i=>post('focus',{point:fixture.anchors[i]});
addEventListener('message',async event=>{
 if(event.source!==frame.contentWindow||event.origin!==location.origin||event.data.channel!==channel)return;
 const m=event.data;
 if(m.type==='ready'){
  try{fixture=await fixtureReady;post('init',{config:{...fixture.display,strategy:fixture.strategy},focus:fixture.task?fixture.anchors[0]:undefined});}
  catch{document.getElementById('status').textContent='合成资料暂不可读';}
 }
 if(m.type==='initialized'){initialized=performance.now();document.querySelectorAll('button').forEach(button=>{button.disabled=false;});if(fixture.task)focus(0);}
 if(m.type==='first-frame')first=performance.now();
 if(m.type==='error')document.getElementById('status').textContent=m.message;
 if(m.type==='frame'){
  peakFrameP95=Math.max(peakFrameP95,m.diagnostics.frameP95Ms);peakFrame=Math.max(peakFrame,m.diagnostics.frameMaxMs);
  latest={...m.diagnostics,points:m.points,loading:m.loading,requests:m.requests,transferred:m.transferred,cachedPoints:m.cached_points,geometries:m.geometries,
   viewReadyMs:m.diagnostics.viewReadyMs?performance.now()-(m.diagnostics.runtimeNowMs-m.diagnostics.viewReadyMs):0,
   firstMs:first,initializedMs:initialized,actionMs:action,pathEndedMs:pathEnded,pathRunning,exactMs,exactValid,peakFrameP95Ms:peakFrameP95,peakFrameMs:peakFrame,nowMs:performance.now(),sample:fixture.sample};
  document.getElementById('diagnostics').textContent=JSON.stringify(latest);
  document.getElementById('status').textContent=m.diagnostics.viewReadyMs?'同质量视野就绪':'视野细化中';
 }
});
document.getElementById('target').onclick=()=>{action=performance.now();focus(0);};
document.getElementById('overview').onclick=()=>{action=performance.now();post('reset');};
document.getElementById('path').onclick=async()=>{
 if(pathRunning){return;}
 pathRunning=true;action=performance.now();pathEnded=0;peakFrameP95=0;peakFrame=0;
 for(const i of [0,1,2,3,0,2,1,3,0]){focus(i);await new Promise(resolve=>setTimeout(resolve,180));}
 pathEnded=performance.now();pathRunning=false;
};
document.getElementById('exact').onclick=async()=>{
 const started=performance.now(),d=fixture.display;
 const query=new URLSearchParams({manifest_sha256:d.source_manifest_sha256,source_sha256:d.source_model_sha256,point_index:String(fixture.indices[0])});
 const response=await fetch('/candidates/'+fixture.sample+'/api/exact?'+query,{cache:'no-store'}),result=await response.json();
 const point=result.points?.[0];
 exactValid=response.ok&&result.state==='ready'&&point?.point_id===d.source_model_sha256+':'+fixture.indices[0]&&point.anchor_m.every((n,i)=>n===fixture.anchors[0][i]);
 exactMs=performance.now()-started;
};
frame.src='/assets/pointcloud-runtime/index.html';
</script></html>
